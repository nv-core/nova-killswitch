<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for nova-killswitchd.

  The daemon runs as root and owns org.novanetwork.KillSwitch. Members of the
  `wheel` group (local admins) may call its methods WITHOUT a password — this
  is what replaces pkexec/polkit and fixes the prompt problem on Silverblue.
  Everyone else is denied (the system bus denies by default).
-->
<busconfig>
  <policy user="root">
    <allow own="org.novanetwork.KillSwitch"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.novanetwork.KillSwitch"/>
    <allow receive_sender="org.novanetwork.KillSwitch"/>
  </policy>
</busconfig>
